<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etichette per i gettoni</title>
<style>
  :root { --teal:#0e7c86; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif; color:#14202a; background:#f4f6f7; }
  .bar { padding:12px 16px; background:#fff; border-bottom:1px solid #d9e0e2; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .bar select, .bar button { font:inherit; padding:8px 12px; border-radius:10px; border:1px solid #d9e0e2; background:#fff; }
  .bar button.primary { background:var(--teal); color:#fff; border-color:var(--teal); font-weight:700; }
  .hint { color:#6b7a82; font-size:13px; }
  .sheet { background:#fff; margin:16px auto; padding:10mm; width:210mm; min-height:297mm; box-sizing:border-box; display:flex; flex-wrap:wrap; gap:6mm; align-content:flex-start; box-shadow:0 2px 12px rgba(0,0,0,.08); }
  .label { width:var(--d); height:var(--d); border-radius:50%; overflow:hidden; position:relative; border:0.3mm dashed #bbb; background:#e7edee; display:grid; place-items:center; page-break-inside:avoid; }
  .label img { width:100%; height:100%; object-fit:cover; display:block; }
  .label .t { position:absolute; left:0; right:0; bottom:0; padding:1.2mm 2mm 2.4mm; background:rgba(255,255,255,.88); font-size:2.6mm; font-weight:700; text-align:center; line-height:1.15; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .label .e { font-size:calc(var(--d) * .45); }
  .empty { padding:40px; text-align:center; color:#6b7a82; }
  @media print { .bar, .empty { display:none; } body { background:#fff; } .sheet { margin:0; box-shadow:none; width:auto; min-height:auto; } .label { border-color:#ddd; } }
</style>
</head>
<body>
<div class="bar">
  <strong>🖨 Etichette per i gettoni</strong>
  <label>Diametro
    <select id="size"><option value="25mm">25 mm</option><option value="30mm" selected>30 mm</option><option value="35mm">35 mm</option><option value="40mm">40 mm</option></select>
  </label>
  <label><input type="checkbox" id="all"> Anche le statuine</label>
  <label><input type="checkbox" id="names" checked> Con il titolo</label>
  <button class="primary" id="print">Stampa</button>
  <span class="hint">Stampa su carta adesiva (100%, senza adattamento alla pagina), ritaglia lungo il cerchio.</span>
</div>
<div id="sheet" class="sheet"></div>
<p id="empty" class="empty" hidden>Nessun gettone collegato.</p>
<script src="/static/i18n.js?v=8"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let items = [];
  function render() {
    const d = $("size").value;
    const sheet = $("sheet");
    sheet.style.setProperty("--d", d);
    const list = items.filter((f) => $("all").checked || f.kind === "coin");
    $("empty").hidden = list.length > 0;
    sheet.innerHTML = list.map((f) => `<div class="label" style="--d:${d}">${f.has_cover ? `<img src="/cover/${f.uid}" alt="">` : `<span class="e">📖</span>`}${$("names").checked ? `<div class="t">${f.title.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]))}</div>` : ""}</div>`).join("");
  }
  fetch("/library").then((r) => r.json()).then((d) => { items = d.figurines || []; render(); });
  ["size", "all", "names"].forEach((id) => $(id).addEventListener("change", render));
  $("print").addEventListener("click", () => window.print());
</script>
</body>
</html>
